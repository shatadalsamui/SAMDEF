[package]
name = "db_processor"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["full"] }
dotenv = "0.15"
zenoh = "1.7"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
