[package]
name = "samdef_detector"
version = "0.1.0"
edition = "2021"  # Use 2021 (2024 isn't a valid edition yet)

[dependencies]
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
image = "0.24.7"
rayon = "1.8.1"
anyhow = "1.0"
prost = "0.12"
prost-types = "0.12"
crossbeam = "0.8"
log = "0.4"
env_logger = "0.10"
ort = { version = "2.0.0-rc.11", features = ["cuda"] }
tokio = { version = "1.0", features = ["full"] }  # For async
ndarray = "0.17.2"
turbojpeg = "1.4.0"
gdal = { version = "0.16", features = ["bindgen"] }
zenoh = "1.7"
bincode = "1.3"

[build-dependencies]
prost-build = "0.12"
