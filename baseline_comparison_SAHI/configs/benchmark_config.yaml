# SAMDEF vs SAHI Benchmark Configuration


model:
  path: "model/run15_FP16.onnx"
  providers: ["CUDAExecutionProvider", "CPUExecutionProvider"]
  device: "cuda:0"
  imgsz: 1152

slicing:
  slice_height: 1152
  slice_width: 1152
  overlap_height_ratio: 0.20
  overlap_width_ratio: 0.20
  perform_standard_pred: false    # Disable full-image downscaled prediction to match SAMDEF pure slicing
  batch_size: 1                   # Match SAMDEF BATCH_SIZE=1 for fair 1:1 GPU batching parity


postprocess:
  type: "NMS"                     # Standard Non-Maximum Suppression
  match_metric: "IOU"
  match_threshold: 0.45           # Standard IoU threshold
  confidence_threshold: 0.01      # Matching detector CLASS_THRESHOLDS baseline (0.01)

dataset:
  input_dir: "/home/shatadal/SAMDEF_DATA/val_images"
  output_dir: "results"
  limit: null                     # Set to integer (e.g. 5) for smoke test, null for full 281 scenes


samdef:
  summary_path: "results/samdef_summary.json"
  gpu_metrics_path: "results/samdef_gpu_metrics.json"
  fallback_runtime_seconds: null
  fallback_scenes_count: null
